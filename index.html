<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tetris — Milestone 3</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #111827;
        color: #f3f4f6;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at top, #1f2937, #111827 65%);
      }

      main {
        padding: 24px;
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
        letter-spacing: 0.14em;
      }

      p {
        margin: 0 0 16px;
        color: #cbd5e1;
        font-size: 0.9rem;
      }

      canvas {
        display: block;
        width: min(300px, calc(100vw - 48px));
        height: auto;
        border: 2px solid #64748b;
        border-radius: 6px;
        background: #0b1220;
        box-shadow: 0 18px 48px #0007;
      }

      .hint {
        margin-top: 14px;
        color: #94a3b8;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TETRIS</h1>
      <p>10 × 20 well · Milestone 3 · Score: <span id="score-value">0</span></p>
      <canvas
        id="game"
        width="300"
        height="600"
        aria-label="Tetris playfield, 10 columns by 20 rows"
      ></canvas>
      <p class="hint" id="game-status" aria-live="polite"></p>
      <p class="hint">↑ rotate · ← / → move · ↓ soft drop · R restart</p>
    </main>
    <script>
      const COLS = 10;
      const ROWS = 20;
      const CELL_SIZE = 30;
      const GRAVITY_MS = 500;
      const PIECES = [
        {
          name: "I",
          color: "#4fc3f7",
          pivot: [1.5, 1.5],
          shape: [
            [0, 1],
            [1, 1],
            [2, 1],
            [3, 1],
          ],
        },
        {
          name: "O",
          color: "#facc15",
          pivot: [0.5, 0.5],
          shape: [
            [0, 0],
            [1, 0],
            [0, 1],
            [1, 1],
          ],
        },
        {
          name: "T",
          color: "#a78bfa",
          pivot: [1, 0],
          shape: [
            [0, 0],
            [1, 0],
            [2, 0],
            [1, 1],
          ],
        },
        {
          name: "S",
          color: "#4ade80",
          pivot: [1, 0],
          shape: [
            [1, 0],
            [2, 0],
            [0, 1],
            [1, 1],
          ],
        },
        {
          name: "Z",
          color: "#fb7185",
          pivot: [1, 0],
          shape: [
            [0, 0],
            [1, 0],
            [1, 1],
            [2, 1],
          ],
        },
        {
          name: "J",
          color: "#60a5fa",
          pivot: [1, 1],
          shape: [
            [0, 0],
            [0, 1],
            [1, 1],
            [2, 1],
          ],
        },
        {
          name: "L",
          color: "#fb923c",
          pivot: [1, 1],
          shape: [
            [2, 0],
            [0, 1],
            [1, 1],
            [2, 1],
          ],
        },
      ];

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreElement = document.getElementById("score-value");
      const statusElement = document.getElementById("game-status");
      let board;
      let activePiece;
      let score;
      let gameOver;

      function createBoard() {
        return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      }

      function setStatus(message) {
        statusElement.textContent = message;
      }

      function draw() {
        ctx.fillStyle = "#0b1220";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "#253247";
        ctx.lineWidth = 1;
        for (let col = 0; col <= COLS; col++) {
          ctx.beginPath();
          ctx.moveTo(col * CELL_SIZE, 0);
          ctx.lineTo(col * CELL_SIZE, canvas.height);
          ctx.stroke();
        }
        for (let row = 0; row <= ROWS; row++) {
          ctx.beginPath();
          ctx.moveTo(0, row * CELL_SIZE);
          ctx.lineTo(canvas.width, row * CELL_SIZE);
          ctx.stroke();
        }

        for (let row = 0; row < ROWS; row++) {
          for (let col = 0; col < COLS; col++) {
            if (board[row][col] !== null) {
              ctx.fillStyle = board[row][col];
              ctx.fillRect(
                col * CELL_SIZE,
                row * CELL_SIZE,
                CELL_SIZE,
                CELL_SIZE,
              );
            }
          }
        }

        if (activePiece) {
          ctx.fillStyle = activePiece.color;
          for (const [dx, dy] of activePiece.shape) {
            ctx.fillRect(
              (activePiece.x + dx) * CELL_SIZE,
              (activePiece.y + dy) * CELL_SIZE,
              CELL_SIZE,
              CELL_SIZE,
            );
          }
        }
      }

      function canOccupy(shape, x, y) {
        return shape.every(([cellX, cellY]) => {
          const col = x + cellX;
          const row = y + cellY;
          return (
            col >= 0 &&
            col < COLS &&
            row >= 0 &&
            row < ROWS &&
            board[row][col] === null
          );
        });
      }

      function clearCompletedRows() {
        let cleared = 0;
        for (let row = ROWS - 1; row >= 0; row--) {
          if (board[row].every((cell) => cell !== null)) {
            board.splice(row, 1);
            board.unshift(Array(COLS).fill(null));
            cleared++;
            row++;
          }
        }

        if (cleared > 0) {
          score += cleared * 100;
          scoreElement.textContent = score;
        }
      }

      function spawnPiece() {
        const definition = PIECES[Math.floor(Math.random() * PIECES.length)];
        const shape = definition.shape.map(([x, y]) => [x, y]);
        const minX = Math.min(...shape.map(([x]) => x));
        const maxX = Math.max(...shape.map(([x]) => x));
        const x = Math.floor((COLS - (maxX - minX + 1)) / 2) - minX;
        const candidate = {
          name: definition.name,
          color: definition.color,
          pivot: [...definition.pivot],
          shape,
          x,
          y: 0,
        };

        if (!canOccupy(candidate.shape, candidate.x, candidate.y)) {
          activePiece = null;
          gameOver = true;
          setStatus("Game Over — press R to restart");
        } else {
          activePiece = candidate;
          setStatus("");
        }
        draw();
      }

      function lockPiece() {
        if (!activePiece || gameOver) return;
        for (const [dx, dy] of activePiece.shape) {
          board[activePiece.y + dy][activePiece.x + dx] = activePiece.color;
        }
        activePiece = null;
        clearCompletedRows();
        spawnPiece();
      }

      function move(dx, dy) {
        if (
          gameOver ||
          !activePiece ||
          !canOccupy(activePiece.shape, activePiece.x + dx, activePiece.y + dy)
        )
          return false;
        activePiece.x += dx;
        activePiece.y += dy;
        draw();
        return true;
      }

      function rotate() {
        if (gameOver || !activePiece) return false;
        const [pivotX, pivotY] = activePiece.pivot;
        const rotatedShape = activePiece.shape.map(([cellX, cellY]) => {
          const offsetX = cellX - pivotX;
          const offsetY = cellY - pivotY;
          return [pivotX - offsetY, pivotY + offsetX];
        });

        if (!canOccupy(rotatedShape, activePiece.x, activePiece.y))
          return false;
        activePiece.shape = rotatedShape;
        draw();
        return true;
      }

      function fall() {
        if (!gameOver && activePiece && !move(0, 1)) lockPiece();
      }

      function resetGame() {
        board = createBoard();
        score = 0;
        gameOver = false;
        activePiece = null;
        scoreElement.textContent = score;
        setStatus("");
        spawnPiece();
      }

      window.addEventListener("keydown", (event) => {
        if (event.key.startsWith("Arrow")) event.preventDefault();
        if (event.key.toLowerCase() === "r") {
          resetGame();
          return;
        }

        if (event.key === "ArrowLeft") move(-1, 0);
        if (event.key === "ArrowRight") move(1, 0);
        if (event.key === "ArrowDown") {
          if (!move(0, 1)) lockPiece();
        }
        if (event.key === "ArrowUp") rotate();
      });

      resetGame();
      setInterval(fall, GRAVITY_MS);
    </script>
  </body>
</html>
