<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tetris — Milestone 1</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #111827;
      color: #f3f4f6;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at top, #1f2937, #111827 65%);
    }

    main {
      padding: 24px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      letter-spacing: 0.14em;
    }

    p {
      margin: 0 0 16px;
      color: #cbd5e1;
      font-size: 0.9rem;
    }

    canvas {
      display: block;
      width: min(300px, calc(100vw - 48px));
      height: auto;
      border: 2px solid #64748b;
      border-radius: 6px;
      background: #0b1220;
      box-shadow: 0 18px 48px #0007;
    }

    .hint {
      margin-top: 14px;
      color: #94a3b8;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>TETRIS</h1>
    <p>10 × 20 well · Milestone 1</p>
    <canvas id="game" width="300" height="600" aria-label="Tetris playfield, 10 columns by 20 rows"></canvas>
    <p class="hint">← / → move · ↓ soft drop</p>
  </main>
  <script>
    const COLS = 10;
    const ROWS = 20;
    const CELL_SIZE = 30;
    const GRAVITY_MS = 500;
    const PIECE_COLOR = '#4fc3f7';
    const PIECE_SHAPE = [[0, 0], [1, 0], [2, 0], [1, 1]];

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const piece = { x: 3, y: 0 };
    let landed = false;

    function draw() {
      ctx.fillStyle = '#0b1220';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#253247';
      ctx.lineWidth = 1;
      for (let col = 0; col <= COLS; col++) {
        ctx.beginPath();
        ctx.moveTo(col * CELL_SIZE, 0);
        ctx.lineTo(col * CELL_SIZE, canvas.height);
        ctx.stroke();
      }
      for (let row = 0; row <= ROWS; row++) {
        ctx.beginPath();
        ctx.moveTo(0, row * CELL_SIZE);
        ctx.lineTo(canvas.width, row * CELL_SIZE);
        ctx.stroke();
      }

      ctx.fillStyle = PIECE_COLOR;
      for (const [dx, dy] of PIECE_SHAPE) {
        ctx.fillRect((piece.x + dx) * CELL_SIZE, (piece.y + dy) * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      }
    }

    function canMove(dx, dy) {
      return PIECE_SHAPE.every(([cellX, cellY]) => {
        const col = piece.x + cellX + dx;
        const row = piece.y + cellY + dy;
        return col >= 0 && col < COLS && row >= 0 && row < ROWS;
      });
    }

    function move(dx, dy) {
      if (landed || !canMove(dx, dy)) return false;
      piece.x += dx;
      piece.y += dy;
      draw();
      return true;
    }

    function fall() {
      if (!move(0, 1)) {
        landed = true;
        clearInterval(gravityTimer);
      }
    }

    window.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight' || event.key === 'ArrowDown') {
        event.preventDefault();
      }

      if (event.key === 'ArrowLeft') move(-1, 0);
      if (event.key === 'ArrowRight') move(1, 0);
      if (event.key === 'ArrowDown') move(0, 1);
    });

    draw();
    const gravityTimer = setInterval(fall, GRAVITY_MS);
  </script>
</body>
</html>
