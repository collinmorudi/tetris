<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tetris — Milestone 2</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #111827;
        color: #f3f4f6;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at top, #1f2937, #111827 65%);
      }

      main {
        padding: 24px;
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
        letter-spacing: 0.14em;
      }

      p {
        margin: 0 0 16px;
        color: #cbd5e1;
        font-size: 0.9rem;
      }

      canvas {
        display: block;
        width: min(300px, calc(100vw - 48px));
        height: auto;
        border: 2px solid #64748b;
        border-radius: 6px;
        background: #0b1220;
        box-shadow: 0 18px 48px #0007;
      }

      .hint {
        margin-top: 14px;
        color: #94a3b8;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TETRIS</h1>
      <p>10 × 20 well · Milestone 2</p>
      <canvas
        id="game"
        width="300"
        height="600"
        aria-label="Tetris playfield, 10 columns by 20 rows"
      ></canvas>
      <p class="hint">↑ rotate · ← / → move · ↓ soft drop</p>
    </main>
    <script>
      const COLS = 10;
      const ROWS = 20;
      const CELL_SIZE = 30;
      const GRAVITY_MS = 500;
      const PIECE_COLOR = "#4fc3f7";
      const PIECE_PIVOT = [1, 0];
      const PIECE_SHAPE = [
        [0, 0],
        [1, 0],
        [2, 0],
        [1, 1],
      ];
      const occupiedCells = new Set();

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const piece = { x: 3, y: 0, shape: PIECE_SHAPE };
      let landed = false;

      function draw() {
        ctx.fillStyle = "#0b1220";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "#253247";
        ctx.lineWidth = 1;
        for (let col = 0; col <= COLS; col++) {
          ctx.beginPath();
          ctx.moveTo(col * CELL_SIZE, 0);
          ctx.lineTo(col * CELL_SIZE, canvas.height);
          ctx.stroke();
        }
        for (let row = 0; row <= ROWS; row++) {
          ctx.beginPath();
          ctx.moveTo(0, row * CELL_SIZE);
          ctx.lineTo(canvas.width, row * CELL_SIZE);
          ctx.stroke();
        }

        ctx.fillStyle = PIECE_COLOR;
        for (const [dx, dy] of piece.shape) {
          ctx.fillRect(
            (piece.x + dx) * CELL_SIZE,
            (piece.y + dy) * CELL_SIZE,
            CELL_SIZE,
            CELL_SIZE,
          );
        }
      }

      function canOccupy(shape, x = piece.x, y = piece.y) {
        return shape.every(([cellX, cellY]) => {
          const col = x + cellX;
          const row = y + cellY;
          return (
            col >= 0 &&
            col < COLS &&
            row >= 0 &&
            row < ROWS &&
            !occupiedCells.has(row * COLS + col)
          );
        });
      }

      function move(dx, dy) {
        if (landed || !canOccupy(piece.shape, piece.x + dx, piece.y + dy))
          return false;
        piece.x += dx;
        piece.y += dy;
        draw();
        return true;
      }

      function rotate() {
        if (landed) return false;
        const rotatedShape = piece.shape.map(([cellX, cellY]) => {
          const offsetX = cellX - PIECE_PIVOT[0];
          const offsetY = cellY - PIECE_PIVOT[1];
          return [PIECE_PIVOT[0] - offsetY, PIECE_PIVOT[1] + offsetX];
        });

        if (!canOccupy(rotatedShape)) return false;
        piece.shape = rotatedShape;
        draw();
        return true;
      }

      function fall() {
        if (!move(0, 1)) {
          landed = true;
          clearInterval(gravityTimer);
        }
      }

      window.addEventListener("keydown", (event) => {
        if (
          event.key === "ArrowLeft" ||
          event.key === "ArrowRight" ||
          event.key === "ArrowDown" ||
          event.key === "ArrowUp"
        ) {
          event.preventDefault();
        }

        if (event.key === "ArrowLeft") move(-1, 0);
        if (event.key === "ArrowRight") move(1, 0);
        if (event.key === "ArrowDown") move(0, 1);
        if (event.key === "ArrowUp") rotate();
      });

      draw();
      const gravityTimer = setInterval(fall, GRAVITY_MS);
    </script>
  </body>
</html>
